name: Optimize photos
on:
  push:
    branches: [main]
    paths: ['images/originals/**']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install sharp --no-save
      - run: node .github/optimize.js
      - name: Commit results
        run: |
          git config user.name "hogs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add images/photos data/photos.json
          git diff --cached --quiet || (git commit -m "auto: optimize photos" && git push)
